<script>
/* ═════ timing (s): re-time here only ═════ */

const LINES = [ // [start, who, text]; who: R=Рауф T=Тимур M=Макс A=Али
  [1.7, 'M', 'Может, по бургеру?'], [3.2, 'T', 'Давай, я голодный.'],

  [26.0, 'R', 'Оформляю — и вот QR-код.'], [29.0, 'M', 'Подожди… и это реально работает?'],
  [32.0, 'R', 'Смотрите.'], [33.6, 'T', 'Да ладно!'],
  [39.0, 'A', 'На четверых — меньше шестнадцати манат.'], [43.0, 'T', 'Всё, теперь только так.']
];
const W = 1080, H = 1920, TOTAL = T.end;
const Q = new URLSearchParams(location.search), SC = +(Q.get('scale') || 1);
const cv = document.getElementById('c'); cv.width = W * SC; cv.height = H * SC; cv.style.width = W + 'px';
const ctx = cv.getContext('2d');
/* palette: five colours, tints only as transparency */
const BG = '#F3EDE2', NV = '#1F2B3D', OR = '#E2621B', SD = '#EBC49A', TL = '#4F8A8B', LT = '#FBF8F2';
const TAU = Math.PI * 2, PI = Math.PI;
let QRM = [];

/* ═════ easing ═════ */
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, a, d) => cl((t - a) / d);
const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out = x => 1 - Math.pow(1 - x, 3), inn = x => x * x * x;
const back = x => { const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, d, f = io) => f(pr(t, a, d));

/* ═════ drawing primitives ═════ */
const fill = c => { ctx.fillStyle = c; };
function rr(x, y, w, h, r, c) { fill(c); ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2)); ctx.fill(); }
function circ(x, y, r, c) { fill(c); ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.fill(); }
function ell(x, y, rx, ry, c, a0 = 0, a1 = TAU) { fill(c); ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), 0, a0, a1); ctx.closePath(); ctx.fill(); }
function poly(pts, c) { fill(c); ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill(); }
function line(x1, y1, x2, y2, w, c) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function arc(x, y, r, a0, a1, w, c) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.stroke(); }
function txt(s, x, y, size, c = NV, o = {}) { ctx.font = `${o.wt || 800} ${size}px UI`; ctx.textAlign = o.al || 'center'; ctx.textBaseline = 'middle'; fill(c); ctx.globalAlpha = o.a ?? 1; ctx.fillText(s, x, y); ctx.globalAlpha = 1; }
const at = (x, y, s, f, r = 0) => { ctx.save(); ctx.translate(x, y); if (r) ctx.rotate(r); if (s !== 1) ctx.scale(s, s); f(); ctx.restore(); };
const alpha = (a, f) => { if (a <= 0) return; const p = ctx.globalAlpha; ctx.globalAlpha = p * a; f(); ctx.globalAlpha = p; };
const blur = (px, f) => { if (px < .3) return f(); ctx.save(); ctx.filter = `blur(${px}px)`; f(); ctx.restore(); };
function camera(cx, cy, z, f, rot = 0) { ctx.save(); ctx.translate(W / 2, H / 2); if (rot) ctx.rotate(rot); ctx.scale(z, z); ctx.translate(-cx, -cy); f(); ctx.restore(); }
// a layer at depth d moves d times as much as the camera (parallax)
function layer(cam, d, f) { ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(lerp(1, cam.z, d), lerp(1, cam.z, d)); ctx.translate(-lerp(W / 2, cam.x, d), -lerp(H / 2, cam.y, d)); f(); ctx.restore(); }

/* ═════ food (palette-built) ═════ */
function burger(s = 1, sp = 0) { at(0, 0, s, () => {
  ell(0, 46 + sp * 1.0, 96, 24, SD, 0, PI); rr(-96, 34 + sp, 192, 14, 7, SD);
  rr(-100, 8 + sp * .5, 200, 30, 15, NV);
  poly([[-104, 4], [104, 4], [92, 16], [70, 6], [48, 16], [24, 6], [0, 16], [-24, 6], [-48, 16], [-70, 6], [-92, 16]].map(([x, y]) => [x, y - sp * .2]), TL);
  poly([[-70, 0], [70, 0], [30, 26], [0, 10], [-30, 26]].map(([x, y]) => [x, y - sp * .4]), OR);
  ell(0, -4 - sp, 98, 70, SD, PI, TAU); rr(-98, -10 - sp, 196, 12, 6, SD);
  [[-50, -36], [-16, -54], [22, -44], [56, -28], [4, -26], [-30, -18]].forEach(([x, y]) => ell(x, y - sp, 7, 3.5, LT));
}); }
function fries(s = 1) { at(0, 0, s, () => {
  [-40, -26, -12, 2, 16, 30, 42].forEach((x, i) => rr(x - 6, -96 + (i % 3) * 14, 12, 90, 5, SD));
  poly([[-58, -26], [58, -26], [46, 76], [-46, 76]], OR); ell(0, -26, 58, 16, OR, 0, PI); rr(-20, 14, 40, 28, 14, LT);
}); }
function shake(s = 1) { at(0, 0, s, () => {
  rr(14, -200, 18, 150, 9, OR);
  poly([[-48, -40], [48, -40], [36, 112], [-36, 112]], LT); rr(-46, 0, 92, 30, 4, TL);
  ell(0, -40, 52, 20, LT); ell(-14, -62, 30, 26, LT); ell(16, -70, 28, 26, LT); ell(0, -92, 22, 20, LT); circ(8, -118, 12, OR);
}); }
function nuggets(s = 1) { at(0, 0, s, () => { poly([[-62, -16], [62, -16], [52, 54], [-52, 54]], TL); poly([[-62, -16], [-48, -60], [48, -60], [62, -16]], TL);
  [[-30, -20], [4, -26], [34, -16], [-8, -40]].forEach(([x, y]) => ell(x, y, 22, 15, SD)); }); }
function tray(w = 400) { rr(-w / 2, -12, w, 24, 12, OR); rr(-w / 2 + 18, -4, 40, 8, 4, LT); rr(w / 2 - 58, -4, 40, 8, 4, LT); }
function logoMark(s) { at(0, 0, s / 32, () => { ctx.translate(-16, -16); rr(0, 0, 32, 32, 9, '#c2500a'); ell(16, 15, 9, 7, '#fff', PI, TAU);
  line(7, 19, 25, 19, 2.2, '#fff'); line(9, 23, 23, 23, 2.2, '#fff'); }); }

/* ═════ characters: geometric, front view. origin = neck base, feet at y≈440 ═════ */
const CAST = {
  R: { top: OR, hair: 'cap', skin: SD },
  T: { top: TL, hair: 'curly', skin: SD },
  M: { top: NV, hair: 'side', skin: SD, glasses: true },
  A: { top: LT, hair: 'buzz', skin: SD, beard: true }
};
function limb(x1, y1, a, l1, b, l2, w, c, hand) { // a, b: angles from straight down; returns end
  const x2 = x1 + Math.sin(a) * l1, y2 = y1 + Math.cos(a) * l1, x3 = x2 + Math.sin(a + b) * l2, y3 = y2 + Math.cos(a + b) * l2;
  ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.stroke();
  if (hand) circ(x3, y3, w * .55, hand); return [x3, y3];
}
function face(o, k) {
  const lx = (o.look || 0) * 12, e = o.eyes || 'open', m = o.mouth || 'smile';
  [-1, 1].forEach(s => { const x = s * 20 + lx, y = -78;
    if (e === 'happy') arc(x, y + 4, 9, PI * 1.15, PI * 1.85, 5, NV);
    else if (e === 'wide') { circ(x, y, 10, LT); circ(x + lx * .1, y + 1, 5.5, NV); }
    else if (e === 'shut') line(x - 7, y + 2, x + 7, y + 2, 5, NV);
    else circ(x, y, 6.5, NV);
    const br = o.brow || 0; line(x - 9, y - 18 - br * 6 + s * br * 2, x + 9, y - 19 - br * 6 - s * br * 2, 5, NV);
    if (o.glasses) { ctx.strokeStyle = NV; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, 15, 0, TAU); ctx.stroke(); }
  });
  if (o.glasses) line(-5 + lx, -80, 5 + lx, -80, 4, NV);
  const my = -48;
  if (m === 'smile') arc(lx, my - 10, 14, PI * .2, PI * .8, 5, NV);
  else if (m === 'grin') { ell(lx, my - 4, 18, 13, NV, 0, PI); rr(lx - 13, my - 4, 26, 5, 2, LT); }
  else if (m === 'open') ell(lx, my, 11, 12 * (o.talk ?? 1), NV);
  else if (m === 'o') ell(lx, my, 7, 8, NV);
  else if (m === 'flat') line(lx - 10, my, lx + 10, my, 5, NV);
  else if (m === 'chew') { ell(lx, my, 12, 5 + 4 * Math.abs(Math.sin(k * 14)), NV); }
  else if (m === 'sip') circ(lx, my, 5, NV);
}
function hair(o) {
  const lx = (o.look || 0) * 4;
  if (o.hair === 'cap') { ell(lx, -98, 63, 52, OR, PI, TAU); rr(lx - 63, -102, 126, 12, 6, OR); rr(lx + (o.look < 0 ? -110 : 10), -98, 100, 16, 8, OR); circ(lx, -148, 6, NV); }
  if (o.hair === 'curly') { for (let i = 0; i < 9; i++) { const a = PI * (1.02 + i / 8 * .96); circ(lx + Math.cos(a) * 58, -84 + Math.sin(a) * 58, 22, NV); } }
  if (o.hair === 'side') { ell(lx, -86, 64, 58, NV, PI, TAU); poly([[lx - 64, -86], [lx - 30, -116], [lx + 64, -96], [lx + 64, -86]], NV); }
  if (o.hair === 'buzz') ell(lx, -90, 62, 50, NV, PI * 1.05, PI * 1.95);
}
function person(o, k = 0) {
  const ph = o.walk, sk = o.skin;
  // legs
  const swing = ph === undefined ? 0 : Math.sin(ph) * .42;
  if (!o.sit) { limb(-30, 196, swing, 120, Math.max(0, -swing) * .6, 120, 50, NV); limb(30, 196, -swing, 120, Math.max(0, swing) * .6, 120, 50, NV);
    const fx = (s) => { const a = s < 0 ? swing : -swing; return [s * 30 + Math.sin(a) * 120 + Math.sin(a + Math.max(0, -a * s) * .6) * 120, 196 + Math.cos(a) * 120 + Math.cos(a) * 120]; };
    [-1, 1].forEach(s => { const [x, y] = fx(s); rr(x - 30 + s * 6, y + 14, 60, 22, 11, LT); rr(x - 30 + s * 6, y + 30, 60, 8, 4, NV); }); }
  // arms behind torso when hanging

  const swa = ph === undefined ? 0 : Math.sin(ph) * .3;
  const drawArm = (s, a) => limb(s * 76, 30, s * (a[0] - (s < 0 ? swa : -swa)), 104, s * a[1], 100, 40, o.top === LT ? SD : o.top, sk);
  // torso
  rr(-82, 0, 164, 214, 46, o.top); if (o.top === LT) { rr(-82, 0, 164, 214, 46, LT); rr(-20, 0, 40, 28, 10, SD); }
  rr(-16, -26, 32, 34, 10, sk); // neck
  if (o.top === OR) { rr(-40, 120, 80, 50, 20, '#00000018'); } // hoodie pocket
  if (o.top === TL) [44, 92, 140].forEach(y => rr(-82, y, 164, 14, 0, '#00000014'));
  if (o.top === NV) { rr(-3, 10, 6, 196, 3, '#ffffff22'); }
  const wl = drawArm(-1, aL), wr = drawArm(1, aR);
  if (o.itemL) at(wl[0], wl[1] - 20, 1, o.itemL); if (o.itemR) at(wr[0], wr[1] - 20, 1, o.itemR);

  circ(0, -76, 64, sk);
  if (o.beard) { ell(0, -56, 60, 48, NV, 0, PI); ell(0, -60, 40, 26, sk, 0, PI); }

}
const P = (who, extra, k) => person(Object.assign({}, CAST[who], extra), k);
const bob = ph => -Math.abs(Math.sin(ph)) * 10;

/* speech bubble: text is the actual line; words land one by one */
function bubble(text, x, y, t0, t, o = {}) {
  const dur = o.dur ?? Math.max(1.5, text.length * .065 + .6);
  if (t < t0 || t > t0 + dur + .3) return;
  const k = seg(t, t0, .28, back), q = seg(t, t0 + dur, .3), size = o.size || 46, maxW = o.maxW || 620;
  ctx.font = `800 ${size}px UI`; const words = text.split(' '), lines = []; let cur = '';
  words.forEach(w => { const s = cur ? cur + ' ' + w : w; if (ctx.measureText(s).width > maxW && cur) { lines.push(cur); cur = w; } else cur = s; }); lines.push(cur);
  const bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 64, bh = lines.length * size * 1.25 + 44, tl = o.tail ?? -1;
  const tailX = x; x = cl(x, bw / 2 + 36, W - bw / 2 - 36); const tlo = cl((tailX - x) / 1, -bw / 2 + 60, bw / 2 - 60);
  at(x, y, (1 - q * .15) * lerp(.6, 1, k), () => { alpha((1 - q) * cl(k * 2), () => {
    const col = o.c || LT, ink = col === NV || col === OR || col === TL ? LT : NV;
    if (o.tail !== 0) poly([[tlo + tl * 10 - 22, -4], [tlo + tl * 46, 40], [tlo + tl * 10 + 22, -4]], col); rr(-bw / 2, -bh, bw, bh, 30, col);
    let n = 0; const shown = Math.floor(pr(t, t0 + .1, Math.max(.3, dur * .45)) * words.length + .999);
    lines.forEach((l, i) => { const ws = l.split(' '); let s = ''; ws.forEach(w => { if (n < shown) s += (s ? ' ' : '') + w; n++; });
      ctx.font = `800 ${size}px UI`; const full = ctx.measureText(l).width; txt(s, -full / 2, -bh + 22 + size * .62 + i * size * 1.25, size, ink, { al: 'left' }); });
  }); });
}
const WHO = { R: OR, T: TL, M: NV, A: LT };

/* ═════ sets ═════ */

  [[-300, 360, 380], [80, 300, 240], [1700, 330, 420], [2050, 280, 300]].forEach(([x, y, w]) => { rr(x, y, w, 300, 0, TL); for (let i = 0; i < 4; i++) rr(x + 30 + i * (w - 60) / 4, y + 50, 30, 40, 4, SD); });

function storefront() {

  txt('БУРГЕРЫ  ·  ШЕЙКИ  ·  ФРИ', 790, 596, 54, LT);
  for (let i = 0; i < 11; i++) { const x = 240 + i * 100; rr(x, 670, 50, 80, 0, OR); rr(x + 50, 670, 50, 80, 0, LT); ell(x + 50, 750, 50, 26, i % 2 ? LT : OR, 0, PI); }
  rr(300, 820, 520, 560, 18, NV); rr(320, 840, 480, 520, 12, TL);
  at(450, 1220, .6, () => burger(1)); at(640, 1210, .55, () => shake(1));
  [430, 680].forEach(x => { rr(x - 1, 840, 2, 70, 1, SD); ell(x, 930, 46, 30, SD, PI, TAU); });
  rr(900, 900, 330, 680, 14, NV); rr(925, 930, 280, 360, 10, TL); circ(1180, 1260, 12, SD);
  rr(-400, 1580, 2600, 340, 0, SD); rr(-400, 1580, 2600, 20, 0, NV);
  for (let x = -380; x < 2200; x += 220) rr(x, 1700, 120, 10, 5, '#00000012');
}
function lampPost(x) { rr(x - 10, 560, 20, 1030, 10, NV); rr(x - 70, 540, 140, 30, 15, NV); ell(x, 600, 60, 34, SD, 0, PI); }
function counterBack(t, o = {}) {

  });

  for (let x = -160; x < 1300; x += 160) rr(x, 1100, 120, 340, 16, '#ffffff14');
  at(210, 1000, 1, () => { rr(-80, -120, 160, 120, 18, NV); rr(-56, -100, 112, 54, 10, SD); });

  rr(-200, 1480, 1500, 440, 0, SD);

  for (let i = 0; i < 6; i++) rr(140 + i * 140, 560, 90, 130, 8, '#1F2B3D55');

/* ═════ phone UI (flat rebuild of the real STAKED site) ═════ */
const PW = 640, PH = 1300;
const ITEMS = [{ n: 'Бургер', p: '2.99 ₼', old: '7 ₼', d: s => burger(s * .62) }, { n: 'Чизбургер', p: '1.99 ₼', d: s => burger(s * .54) },

const CARD = i => [i % 2 ? 148 : -148, -250 + Math.floor(i / 2) * 410];
const ORDER = [0, 0, 1, 1, 2, 3];
function phoneBody() { rr(-PW / 2 - 18, -PH / 2 - 18, PW + 36, PH + 36, 86, NV); rr(-PW / 2, -PH / 2, PW, PH, 70, LT); rr(-70, -PH / 2 + 22, 140, 36, 18, NV); }
function header(bal, plusK = 0) {

  layer(cam, 1.5, () => blur(10, () => { at(120, 1500, 1.4, () => shake(1)); at(1150, 1520, 1.4, () => fries(1)); }));
  const sx = wx => (wx - cam.x) * cam.z + W / 2; bubble(LINES[11][2], sx(220), 700, LINES[11][0], t, { c: LT, tail: -1, maxW: 700 }); bubble(LINES[12][2], sx(450), 700, LINES[12][0], t, { c: TL, tail: -1 });
}
function sceneLogo(t) {
  const lt = t - T.logo;
  rr(0, 0, W, H, 0, BG);
  const push = seg(lt, 0, 1.0, io), split = seg(lt, .7, .8), morph = seg(lt, 1.3, 1.1), sq = seg(lt, 1.9, .8, back);
  const cx = W / 2, cy = 800, S = lerp(1.397, 2.2, push);
  if (lt < .3) alpha(1 - seg(lt, 0, .3), () => sceneTable(T.logo - .0001));
  // orange square grows out of the patty
  if (sq > 0) at(cx, cy, 1, () => rr(-210 * sq, -210 * sq, 420 * sq, 420 * sq, 118 * sq, '#c2500a'));
  // three burger layers → three logo elements
  const dome = { x: 0, y: lerp(-4 - 60 * split, -26, morph), rx: lerp(98 * S, 118, morph), ry: lerp(70 * S, 92, morph) };
  const pat = { y: lerp(20 * S, 48, morph), w: lerp(200 * S, 236, morph), h: lerp(30 * S, 26, morph) };
  const bot = { y: lerp(46 * S + 60 * split, 104, morph), w: lerp(192 * S, 184, morph), h: lerp(30 * S, 26, morph) };
  const col = morph > .5 ? '#fff' : null;
  at(cx, cy, 1, () => {
    ell(0, dome.y * (morph > 0 ? 1 : S), dome.rx, dome.ry, col || SD, PI, TAU);
    if (morph < .5) alpha(1 - morph * 2, () => { poly([[-100 * S, 0], [100 * S, 0], [0, 26 * S]].map(([x, y]) => [x, y + 6]), OR); rr(-104 * S, -6, 208 * S, 14, 7, TL); });
    rr(-pat.w / 2, pat.y - pat.h / 2, pat.w, pat.h, pat.h / 2, col || NV);
    rr(-bot.w / 2, bot.y - bot.h / 2, bot.w, bot.h, bot.h / 2, col || SD);
  });
  // wordmark letter by letter, then tagline and the site
  'STAKED'.split('').forEach((ch, i) => { const k = seg(lt, 2.6 + i * .07, .6, out); if (k <= 0) return; ctx.save(); ctx.beginPath(); ctx.rect(0, 1120, W, 120); ctx.clip();
    txt(ch, cx - 250 + i * 100, 1180 + (1 - k) * 120, 150, NV); ctx.restore(); });
  const k2 = seg(lt, 3.4, .7, out); alpha(k2, () => txt('Вкусно, много — и дешевле', cx, 1310 + (1 - k2) * 30, 52, TL));
  const k3 = seg(lt, 4.1, .6, back); if (k3 > 0) at(cx, 1480, k3, () => { rr(-330, -56, 660, 112, 56, OR); txt('stackd-frontend.vercel.app', 0, 2, 38, LT); });
  const k4 = seg(lt, 4.6, .6, out); alpha(k4, () => txt('Telegram  @stackdbaku', cx, 1620, 40, NV, { wt: 500 }));
  // slow breathing of the mark keeps the hold alive
  if (lt > 3) { const b = Math.sin((lt - 3) * 1.6) * .5 + .5; alpha(.25, () => { ctx.strokeStyle = OR; ctx.lineWidth = 4; ctx.beginPath(); ctx.roundRect(cx - 240 - b * 20, cy - 240 - b * 20, 480 + b * 40, 480 + b * 40, 130); ctx.stroke(); }); }
}

/* ═════ frame ═════ */
function renderAt(t) {
  ctx.setTransform(SC, 0, 0, SC, 0, 0); rr(0, 0, W, H, 0, BG);
  if (t < T.counter) sceneStreet(t);
  else if (t < T.phone) sceneCounter(t);
  else if (t < T.shrink) scenePhone(t);
  else if (t < T.kiosk) { const k = seg(t, T.shrink, T.kiosk - T.shrink, inn); sceneKiosk(T.kiosk); alpha(1 - cl(k * 1.4 - .4), () => at(lerp(W / 2, 900, k), lerp(H / 2 + 110, 1020, k), lerp(1.15, .18, k), () => { phoneBody(); phoneScreen(t); })); }
  else if (t < T.table) sceneKiosk(t);
  else if (t < T.logo) sceneTable(t);
  else sceneLogo(t);
  // seam into the logo: the table scene pushes into a burger, then the logo scene picks the same burger up
}
